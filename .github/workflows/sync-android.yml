name: Sync & Build Android

on:
  schedule:
    - cron: "0 2 * * *"          # 每天北京时间 10:00
  workflow_dispatch:
    inputs:
      force_sync:
        description: "Force sync even if no changes detected"
        required: false
        default: "false"
        type: boolean

  repository_dispatch:
    types: [upstream-update]

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      version: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/openclaw/openclaw.git
          git fetch upstream --tags --depth=1

      - name: Detect changes
        id: changes
        run: |
          LOCAL_HASH=$(git rev-parse HEAD)
          UPSTREAM_HASH=$(git rev-parse upstream/main)
          if [ "$LOCAL_HASH" = "$UPSTREAM_HASH" ] && [ "$FORCE_SYNC" != "true" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected, skipping build."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
        env:
          FORCE_SYNC: ${{ github.event.inputs.force_sync }}

      - name: Sync & push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git merge upstream/main --no-edit -m "sync: merge upstream/main $(date -u +%Y-%m-%d)"
          git push origin main
          echo "Synced and pushed."

      - name: Get latest tag
        id: version
        if: steps.changes.outputs.changed == 'true'
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  build-android:
    needs: sync
    runs-on: ubuntu-latest
    if: needs.sync.outputs.changed == 'true' || github.event.inputs.force_sync == 'true'
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            apps/
            .github/
          sparse-checkout-cone-mode: false

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle
          cache-dependency-path: apps/android/**/*.gradle*

      - name: Setup Android SDK
        run: |
          ANDROID_SDK_ROOT="$HOME/.android-sdk"
          CMDLINE_TOOLS="commandlinetools-linux-14742923_latest.zip"
          if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            curl -fsSL "https://dl.google.com/android/repository/$CMDLINE_TOOLS" -o "/tmp/$CMDLINE_TOOLS"
            unzip -q "/tmp/$CMDLINE_TOOLS" -d "$ANDROID_SDK_ROOT/cmdline-tools"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Build Debug APK
        working-directory: apps/android
        run: ./gradlew --no-daemon assemblePlayDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-android-apk
          path: apps/android/app/build/outputs/apk/play/debug/*.apk
          retention-days: 7

  release:
    needs: [sync, build-android]
    runs-on: ubuntu-latest
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: openclaw-android-apk
          path: ./apk

      - name: Create Release
        env:
          TAG: ${{ needs.sync.outputs.version }}
        run: |
          echo "Creating release for $TAG"
          gh release create "$TAG" \
            --title "OpenClaw Android $TAG" \
            --notes "Auto-generated Android release. Built from upstream sync." \
            ./apk/*.apk
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
